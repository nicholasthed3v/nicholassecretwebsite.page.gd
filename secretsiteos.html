<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecretOS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --bar: #0f3460;
            --accent: #e94560;
            --accent2: #53d8fb;
            --text: #cdd6f4;
            --text-dim: #6c7086;
            --border: #313244;
            --win-bg: #1e1e2e;
            --win-header: #181825;
            --btn-close: #f38ba8;
            --btn-min: #f9e2af;
            --btn-max: #a6e3a1;
            --font: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* DESKTOP */
        #desktop {
            width: 100vw;
            height: calc(100vh - 36px);
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
        }

        #desktop::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 20% 50%, rgba(83,216,251,0.03) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(233,69,96,0.03) 0%, transparent 50%);
        }

        /* TASKBAR */
        #taskbar {
            position: fixed;
            bottom: 0; left: 0;
            width: 100%; height: 36px;
            background: var(--bar);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
            z-index: 9999;
        }

        #start-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 4px 12px;
            font-family: var(--font);
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }
        #start-btn:hover { background: #c73652; }

        .taskbar-app {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 10px;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .taskbar-app:hover { background: rgba(255,255,255,0.15); }
        .taskbar-app.active { border-color: var(--accent2); color: var(--accent2); }

        #clock {
            margin-left: auto;
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
        }

        /* START MENU */
        #start-menu {
            position: fixed;
            bottom: 36px; left: 0;
            width: 200px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-bottom: none;
            display: none;
            z-index: 9998;
            flex-direction: column;
        }
        #start-menu.open { display: flex; }
        .start-item {
            padding: 10px 15px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .start-item:hover { background: rgba(233,69,96,0.15); color: var(--accent); }
        .start-item .icon { font-size: 16px; }

        /* DESKTOP ICONS */
        .desktop-icon {
            position: absolute;
            width: 70px;
            text-align: center;
            cursor: pointer;
            padding: 8px 4px;
        }
        .desktop-icon:hover .icon-img { background: rgba(83,216,251,0.1); }
        .desktop-icon .icon-img {
            font-size: 32px;
            display: block;
            margin: 0 auto 4px;
            padding: 6px;
        }
        .desktop-icon .icon-label {
            font-size: 10px;
            color: var(--text);
            word-break: break-word;
            text-shadow: 0 1px 3px #000;
        }

        /* WINDOWS */
        .window {
            position: absolute;
            min-width: 300px;
            min-height: 200px;
            background: var(--win-bg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .window.focused { border-color: var(--accent2); z-index: 200; }
        .window.minimized { display: none; }

        .win-header {
            background: var(--win-header);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: move;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .win-btns { display: flex; gap: 5px; }
        .win-btn {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .win-btn.close { background: var(--btn-close); }
        .win-btn.min   { background: var(--btn-min); }
        .win-btn.max   { background: var(--btn-max); }
        .win-title {
            font-size: 11px;
            color: var(--text-dim);
            flex: 1;
            text-align: center;
        }
        .win-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* TERMINAL */
        #term-output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 12px;
            line-height: 1.6;
            background: #11111b;
        }
        #term-output::-webkit-scrollbar { width: 4px; }
        #term-output::-webkit-scrollbar-thumb { background: #333; }
        .term-line { color: var(--text); }
        .term-prompt { color: var(--accent2); }
        .term-error { color: var(--btn-close); }
        .term-success { color: var(--btn-max); }
        .term-info { color: var(--accent2); }
        #term-input-row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background: #11111b;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        #term-prompt-label { color: var(--accent2); font-size: 12px; margin-right: 6px; white-space: nowrap; }
        #term-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
        }

        /* TEXT EDITOR */
        #editor-toolbar {
            display: flex;
            gap: 4px;
            padding: 6px 8px;
            background: var(--win-header);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .ed-btn {
            background: #313244;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 8px;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
        }
        .ed-btn:hover { background: #45475a; }
        #editor-area {
            flex: 1;
            background: #11111b;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 12px;
            padding: 10px;
            resize: none;
            line-height: 1.6;
        }
        #editor-status {
            padding: 3px 10px;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--win-header);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* FILE EXPLORER */
        #files-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            background: var(--win-header);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            flex-shrink: 0;
        }
        #files-path {
            background: #11111b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 8px;
            font-family: var(--font);
            font-size: 11px;
            flex: 1;
        }
        #files-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            background: #11111b;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
        }
        .file-item:hover { background: rgba(83,216,251,0.08); }
        .file-item.selected { background: rgba(83,216,251,0.15); color: var(--accent2); }

        /* BROWSER */
        #browser-bar {
            display: flex;
            gap: 6px;
            padding: 6px 8px;
            background: var(--win-header);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        #browser-url {
            flex: 1;
            background: #11111b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            font-family: var(--font);
            font-size: 11px;
            outline: none;
        }
        .browser-navbtn {
            background: #313244;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
        }
        .browser-navbtn:hover { background: #45475a; }
        #browser-content {
            flex: 1;
            background: #11111b;
            padding: 20px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.7;
        }

        /* CALCULATOR */
        #calc-display {
            background: #11111b;
            border-bottom: 1px solid var(--border);
            padding: 15px;
            text-align: right;
            flex-shrink: 0;
        }
        #calc-expr { font-size: 11px; color: var(--text-dim); min-height: 16px; }
        #calc-result { font-size: 28px; color: var(--text); }
        #calc-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--border);
            flex: 1;
        }
        .calc-btn {
            background: #313244;
            border: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            cursor: pointer;
            padding: 14px;
        }
        .calc-btn:hover { background: #45475a; }
        .calc-btn.op { color: var(--accent2); }
        .calc-btn.eq { background: var(--accent); color: #fff; }
        .calc-btn.eq:hover { background: #c73652; }
        .calc-btn.clr { color: var(--btn-close); }

        /* PAINT */
        #paint-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: var(--win-header);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .paint-color {
            width: 18px; height: 18px;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .paint-color.selected { border-color: #fff; }
        #paint-size { width: 60px; accent-color: var(--accent); }
        #paint-canvas {
            flex: 1;
            display: block;
            background: #fff;
            cursor: crosshair;
        }
        .paint-tool-btn {
            background: #313244;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 8px;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
        }
        .paint-tool-btn:hover, .paint-tool-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* SETTINGS */
        #settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #11111b;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .setting-group {
            border: 1px solid var(--border);
            padding: 12px;
        }
        .setting-group h3 {
            font-size: 11px;
            color: var(--accent2);
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-val { color: var(--accent2); font-size: 11px; }
        .setting-btn {
            background: #313244;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 3px 10px;
            font-family: var(--font);
            font-size: 11px;
            cursor: pointer;
        }
        .setting-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ABOUT */
        #about-body {
            flex: 1;
            background: #11111b;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .about-logo {
            font-size: 36px;
            text-align: center;
            padding: 10px;
        }
        .about-name {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent2);
        }
        .about-ver {
            text-align: center;
            font-size: 11px;
            color: var(--text-dim);
        }
        .about-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }
        .about-row span:last-child { color: var(--accent2); }

        /* CLOCK APP */
        #clock-app-body {
            flex: 1;
            background: #11111b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        #big-clock {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 4px;
        }
        #big-date {
            font-size: 14px;
            color: var(--text-dim);
        }

        /* Scrollbar global */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #11111b; }
        ::-webkit-scrollbar-thumb { background: #45475a; }

        /* BANNED SCREEN */
        #banned-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999999;
            gap: 20px;
        }
        #banned-title {
            font-size: 22px;
            color: #e94560;
            font-weight: 700;
            text-align: center;
            max-width: 500px;
            line-height: 1.8;
        }
        #banned-sub {
            font-size: 12px;
            color: #333;
        }

        /* Boot screen */
        #boot-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            gap: 20px;
        }
        #boot-logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 6px;
        }
        #boot-sub { font-size: 12px; color: var(--text-dim); }
        #boot-bar-wrap {
            width: 200px;
            height: 3px;
            background: #222;
        }
        #boot-bar {
            height: 3px;
            background: var(--accent2);
            width: 0%;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

<!-- BOOT -->
<div id="boot-screen">
    <div id="boot-logo">SecretOS</div>
    <div id="boot-sub">Nicholas's Secret Site OS v1.0</div>
    <div id="boot-bar-wrap"><div id="boot-bar"></div></div>
    <div id="boot-msg" style="font-size:11px;color:#444;">Initializing...</div>
</div>

<!-- BANNED SCREEN -->
<div id="banned-screen">
    <div id="banned-title">you thought you could do that?<br>well, nice job.<br>You've blocked yourself. forever.</div>
    <div id="banned-sub">account banned from SecretOS</div>
</div>

<!-- DESKTOP -->
<div id="desktop">
    <!-- Icons placed by JS -->
</div>

<!-- TASKBAR -->
<div id="taskbar">
    <button id="start-btn" onclick="toggleStart()">⚡ Menu</button>
    <div id="taskbar-apps"></div>
    <div id="clock">--:--:--</div>
</div>

<!-- START MENU -->
<div id="start-menu">
    <div class="start-item" onclick="openApp('terminal')"><span class="icon">🖥️</span> Terminal</div>
    <div class="start-item" onclick="openApp('editor')"><span class="icon">📝</span> Text Editor</div>
    <div class="start-item" onclick="openApp('files')"><span class="icon">📁</span> File Explorer</div>
    <div class="start-item" onclick="openApp('browser')"><span class="icon">🌐</span> Browser</div>
    <div class="start-item" onclick="openApp('calculator')"><span class="icon">🔢</span> Calculator</div>
    <div class="start-item" onclick="openApp('paint')"><span class="icon">🎨</span> Paint</div>
    <div class="start-item" onclick="openApp('clock')"><span class="icon">🕐</span> Clock</div>
    <div class="start-item" onclick="openApp('settings')"><span class="icon">⚙️</span> Settings</div>
    <div class="start-item" onclick="openApp('about')"><span class="icon">💻</span> About This PC</div>
</div>

<script>
// Check if banned on load
if (localStorage.getItem("secretos_banned") === "1") {
    document.getElementById("banned-screen").style.display = "flex";
    document.addEventListener("DOMContentLoaded", () => {
        const t = document.getElementById("taskbar");
        const d = document.getElementById("desktop");
        if (t) t.style.pointerEvents = "none";
        if (d) d.style.pointerEvents = "none";
    });
}

// ===================== BOOT =====================
const bootMessages = ['Loading kernel...','Mounting filesystems...','Starting services...','Loading desktop...','Welcome, Nicholas.'];
let bootProgress = 0;
const bootBar = document.getElementById('boot-bar');
const bootMsg = document.getElementById('boot-msg');

function bootStep() {
    bootProgress += 20;
    bootBar.style.width = bootProgress + '%';
    bootMsg.textContent = bootMessages[Math.floor(bootProgress/20)-1] || '';
    if (bootProgress < 100) {
        setTimeout(bootStep, 400 + Math.random()*300);
    } else {
        setTimeout(() => {
            document.getElementById('boot-screen').style.transition = 'opacity 0.5s';
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('boot-screen').remove(), 500);
        }, 600);
    }
}
setTimeout(bootStep, 500);

// ===================== CLOCK =====================
function updateClock() {
    const now = new Date();
    const t = now.toLocaleTimeString();
    document.getElementById('clock').textContent = t;
    if (document.getElementById('big-clock'))
        document.getElementById('big-clock').textContent = t;
    if (document.getElementById('big-date'))
        document.getElementById('big-date').textContent = now.toDateString();
}
setInterval(updateClock, 1000);
updateClock();

// ===================== WINDOW MANAGER =====================
let zTop = 200;
const windows = {};
const taskbarApps = document.getElementById('taskbar-apps');

const appDefs = {
    terminal:   { title: '🖥️ Terminal',      w: 600, h: 400 },
    editor:     { title: '📝 Text Editor',    w: 600, h: 450 },
    files:      { title: '📁 File Explorer',  w: 500, h: 400 },
    browser:    { title: '🌐 Browser',        w: 650, h: 450 },
    calculator: { title: '🔢 Calculator',     w: 280, h: 380 },
    paint:      { title: '🎨 Paint',          w: 600, h: 460 },
    clock:      { title: '🕐 Clock',          w: 280, h: 200 },
    settings:   { title: '⚙️ Settings',       w: 420, h: 450 },
    about:      { title: '💻 About This PC',  w: 380, h: 380 },
};

function openApp(id) {
    closeStart();
    if (windows[id]) {
        // unminimize and focus
        const w = windows[id];
        w.classList.remove('minimized');
        focusWindow(id);
        return;
    }
    const def = appDefs[id];
    const win = document.createElement('div');
    win.className = 'window';
    win.id = 'win-' + id;
    win.style.width = def.w + 'px';
    win.style.height = def.h + 'px';
    // Random-ish position
    const maxX = window.innerWidth - def.w - 20;
    const maxY = window.innerHeight - def.h - 56;
    win.style.left = (60 + Math.random() * Math.max(0, maxX - 60)) + 'px';
    win.style.top  = (20 + Math.random() * Math.max(0, maxY - 20)) + 'px';
    win.style.zIndex = ++zTop;

    // Header
    const header = document.createElement('div');
    header.className = 'win-header';
    header.innerHTML = `
        <div class="win-btns">
            <button class="win-btn close" onclick="closeApp('${id}')"></button>
            <button class="win-btn min"   onclick="minApp('${id}')"></button>
            <button class="win-btn max"   onclick="maxApp('${id}')"></button>
        </div>
        <div class="win-title">${def.title}</div>
    `;
    win.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'win-body';
    body.id = 'body-' + id;
    win.appendChild(body);

    document.getElementById('desktop').appendChild(win);
    windows[id] = win;

    makeDraggable(win, header);
    focusWindow(id);
    buildAppContent(id, body);
    addTaskbarBtn(id, def.title);
}

function closeApp(id) {
    if (windows[id]) {
        windows[id].remove();
        delete windows[id];
        removeTaskbarBtn(id);
    }
}

function minApp(id) {
    if (windows[id]) {
        windows[id].classList.add('minimized');
        const btn = document.getElementById('tbtn-' + id);
        if (btn) btn.classList.remove('active');
    }
}

let maximized = {};
function maxApp(id) {
    const win = windows[id];
    if (!win) return;
    if (maximized[id]) {
        Object.assign(win.style, maximized[id]);
        delete maximized[id];
    } else {
        maximized[id] = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
        win.style.width = '100vw';
        win.style.height = 'calc(100vh - 36px)';
        win.style.left = '0';
        win.style.top = '0';
    }
}

function focusWindow(id) {
    Object.keys(windows).forEach(k => {
        windows[k].classList.remove('focused');
        const b = document.getElementById('tbtn-' + k);
        if (b) b.classList.remove('active');
    });
    if (windows[id]) {
        windows[id].classList.add('focused');
        windows[id].style.zIndex = ++zTop;
        const b = document.getElementById('tbtn-' + id);
        if (b) b.classList.add('active');
    }
}

function addTaskbarBtn(id, title) {
    const btn = document.createElement('button');
    btn.className = 'taskbar-app active';
    btn.id = 'tbtn-' + id;
    btn.textContent = title;
    btn.onclick = () => {
        if (windows[id] && windows[id].classList.contains('minimized')) {

    };

}

// Drag
function makeDraggable(win, handle) {
    let ox, oy;
    handle.addEventListener('mousedown', e => {
        if (e.target.classList.contains('win-btn')) return;
        focusWindow(win.id.replace('win-',''));
        ox = e.clientX - win.offsetLeft;
        oy = e.clientY - win.offsetTop;
        function onMove(e) {
            let nx = e.clientX - ox;
            let ny = e.clientY - oy;
            nx = Math.max(0, Math.min(nx, window.innerWidth - win.offsetWidth));
            ny = Math.max(0, Math.min(ny, window.innerHeight - 36 - win.offsetHeight));
            win.style.left = nx + 'px';
            win.style.top  = ny + 'px';
        }
        function onUp() {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    });
    win.addEventListener('mousedown', () => focusWindow(win.id.replace('win-','')));
}

function runCommand(input) {
    if (localStorage.getItem("secretos_banned") === "1") {
        triggerBan(); return;
    }
    if (!input) return;
    // easter egg
    if (input.trim() === 'sudo rm -rf /') { triggerBan(); return; }
    const parts = input.trim().split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    const commands = {
        help: () => {
            termPrint('Available commands:', 'term-info');
            ['ls','cd','pwd','cat','echo','clear','whoami','date','uname','mkdir','touch','rm','cowsay','joke','exit'].forEach(c => termPrint('  ' + c));
        },
        ls: () => {
            const children = fsTree[termCwd] || [];
            if (children.length === 0) { termPrint('(empty)'); return; }
            children.forEach(f => {
                const full = termCwd.replace(/\/$/, '') + '/' + f;
                const isDir = !!fsTree[full];
                termPrint((isDir ? '📁 ' : '📄 ') + f);
            });
        },
        pwd: () => termPrint(termCwd),
        cd: () => {
            if (!args[0] || args[0] === '~') { termCwd = '/home/nicholas'; updatePrompt(); return; }
            if (args[0] === '..') {
                const parts = termCwd.split('/').filter(Boolean);
                parts.pop();
                termCwd = '/' + parts.join('/') || '/';
                updatePrompt(); return;
            }
            const target = args[0].startsWith('/') ? args[0] : termCwd.replace(/\/$/, '') + '/' + args[0];
            if (fsTree[target] !== undefined) { termCwd = target; updatePrompt(); }
            else termPrint('cd: ' + args[0] + ': No such directory', 'term-error');
        },
        cat: () => {
            if (!args[0]) { termPrint('cat: missing operand', 'term-error'); return; }
            const full = args[0].startsWith('/') ? args[0] : termCwd.replace(/\/$/, '') + '/' + args[0];
            if (fileContents[full]) {
                fileContents[full].split('\n').forEach(l => termPrint(l));
            } else if (fsTree[full]) {
                termPrint('cat: ' + args[0] + ': Is a directory', 'term-error');
            } else {
                termPrint('cat: ' + args[0] + ': No such file', 'term-error');
            }
        },
        echo: () => termPrint(args.join(' ')),
        clear: () => { const o = document.getElementById('term-output'); if (o) o.innerHTML = ''; },
        whoami: () => termPrint('nicholas'),
        date: () => termPrint(new Date().toString()),
        uname: () => termPrint('SecretOS 1.0 kernel-fake x86_64'),
        mkdir: () => {
            if (!args[0]) { termPrint('mkdir: missing operand', 'term-error'); return; }
            const full = termCwd.replace(/\/$/, '') + '/' + args[0];
            fsTree[full] = [];
            if (!fsTree[termCwd]) fsTree[termCwd] = [];
            if (!fsTree[termCwd].includes(args[0])) fsTree[termCwd].push(args[0]);
            termPrint('Directory created: ' + args[0], 'term-success');
        },
        touch: () => {
            if (!args[0]) { termPrint('touch: missing operand', 'term-error'); return; }
            const full = termCwd.replace(/\/$/, '') + '/' + args[0];
            fileContents[full] = '';
            if (!fsTree[termCwd]) fsTree[termCwd] = [];
            if (!fsTree[termCwd].includes(args[0])) fsTree[termCwd].push(args[0]);
            termPrint('File created: ' + args[0], 'term-success');
        },
        rm: () => {
            if (!args[0]) { termPrint('rm: missing operand', 'term-error'); return; }
            const full = termCwd.replace(/\/$/, '') + '/' + args[0];
            delete fileContents[full];
            if (fsTree[termCwd]) fsTree[termCwd] = fsTree[termCwd].filter(f => f !== args[0]);
            termPrint('Removed: ' + args[0], 'term-success');
        },
        cowsay: () => {
            const msg = args.join(' ') || 'moo';
            const line = '-'.repeat(msg.length + 2);
            termPrint(' ' + line);
            termPrint('< ' + msg + ' >');
            termPrint(' ' + line);
            termPrint('        \\   ^__^');
            termPrint('         \\  (oo)\\_______');
            termPrint('            (__)\\       )\\/\\');
            termPrint('                ||----w |');
            termPrint('                ||     ||');
        },
        joke: () => {
            const jokes = [
                'Why do programmers prefer dark mode? Because light attracts bugs.',
                'A SQL query walks into a bar, walks up to two tables and asks... "Can I join you?"',
                'Why did the developer go broke? Because he used up all his cache.',
                'How do you comfort a JavaScript bug? You console it.',
                'I would tell you a UDP joke but you might not get it.',
            ];
            termPrint(jokes[Math.floor(Math.random()*jokes.length)], 'term-success');
        },
        exit: () => closeApp('terminal'),
    };

    if (commands[cmd]) commands[cmd]();
    else termPrint(cmd + ': command not found. Type "help" for commands.', 'term-error');
    scrollTerminal();
}

function calcInput(val) {
    const expr = document.getElementById('calc-expr');
    const res  = document.getElementById('calc-result');
    if (!expr || !res) return;
    if (val === 'C') { calcExpr = ''; res.textContent = '0'; expr.textContent = ''; return; }
    if (val === '=') {
        try {
            expr.textContent = calcExpr + ' =';
            const result = Function('"use strict"; return (' + calcExpr + ')')();
            res.textContent = parseFloat(result.toFixed(10)).toString();
            calcExpr = result.toString();
        } catch { res.textContent = 'Error'; calcExpr = ''; }
        return;
    }
    calcExpr += val;
    expr.textContent = calcExpr;
    try {
        const r = Function('"use strict"; return (' + calcExpr + ')')();
        if (isFinite(r)) res.textContent = parseFloat(r.toFixed(10)).toString();
    } catch {}
}

// --- PAINT ---
let painting = false;
let paintColor = '#e94560';
let paintSize = 6;
let paintTool = 'pen';
let lastX = 0, lastY = 0;

function buildPaint(body) {
    const colors = ['#e94560','#53d8fb','#a6e3a1','#f9e2af','#cba6f7','#fff','#888','#000','#f38ba8','#fab387'];
    body.innerHTML = `
        <div id="paint-toolbar">
            <button class="paint-tool-btn active" id="ptool-pen" onclick="setPaintTool('pen')">✏️ Pen</button>
            <button class="paint-tool-btn" id="ptool-eraser" onclick="setPaintTool('eraser')">🧹 Eraser</button>
            ${colors.map(c => `<div class="paint-color" style="background:${c}" onclick="setPaintColor('${c}',this)"></div>`).join('')}
            <input type="range" id="paint-size" min="1" max="40" value="6" oninput="paintSize=this.value" style="width:60px">
            <button class="paint-tool-btn" onclick="clearPaint()">Clear</button>
        </div>
        <canvas id="paint-canvas"></canvas>`;

    setTimeout(() => {
        const canvas = document.getElementById('paint-canvas');
        if (!canvas) return;
        const win = document.getElementById('win-paint');
        canvas.width  = win ? win.offsetWidth : 580;
        canvas.height = win ? win.offsetHeight - 70 : 360;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        canvas.addEventListener('mousedown', e => {
            painting = true;
            const r = canvas.getBoundingClientRect();
            lastX = e.clientX - r.left;
            lastY = e.clientY - r.top;
        });
        canvas.addEventListener('mousemove', e => {
            if (!painting) return;
            const r = canvas.getBoundingClientRect();
            const x = e.clientX - r.left;
            const y = e.clientY - r.top;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = paintTool === 'eraser' ? '#ffffff' : paintColor;
            ctx.lineWidth = paintTool === 'eraser' ? paintSize * 3 : paintSize;
            ctx.lineCap = 'round';
            ctx.stroke();
            lastX = x; lastY = y;
        });
        canvas.addEventListener('mouseup', () => painting = false);
        canvas.addEventListener('mouseleave', () => painting = false);

        // select first color
        document.querySelector('.paint-color').classList.add('selected');
    }, 50);
}

function setPaintColor(c, el) {
    paintColor = c;
    document.querySelectorAll('.paint-color').forEach(e => e.classList.remove('selected'));
    if (el) el.classList.add('selected');
    setPaintTool('pen');
}

function setPaintTool(t) {
    paintTool = t;
    document.querySelectorAll('.paint-tool-btn').forEach(e => e.classList.remove('active'));
    const btn = document.getElementById('ptool-' + t);
    if (btn) btn.classList.add('active');
}

function clearPaint() {
    const canvas = document.getElementById('paint-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

const desktopIcons = [
    { id: 'terminal',   label: 'Terminal',      icon: '🖥️',  x: 20,  y: 20  },
    { id: 'editor',     label: 'Text Editor',   icon: '📝',  x: 20,  y: 110 },
    { id: 'files',      label: 'Files',         icon: '📁',  x: 20,  y: 200 },
    { id: 'browser',    label: 'Browser',       icon: '🌐',  x: 20,  y: 290 },
    { id: 'calculator', label: 'Calculator',    icon: '🔢',  x: 20,  y: 380 },
    { id: 'paint',      label: 'Paint',         icon: '🎨',  x: 100, y: 20  },
    { id: 'clock',      label: 'Clock',         icon: '🕐',  x: 100, y: 110 },
    { id: 'settings',   label: 'Settings',      icon: '⚙️',  x: 100, y: 200 },
    { id: 'about',      label: 'About',         icon: '💻',  x: 100, y: 290 },
];

const desktop = document.getElementById('desktop');
desktopIcons.forEach(ic => {
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.style.left = ic.x + 'px';
    el.style.top  = ic.y + 'px';
    el.innerHTML = `<span class="icon-img">${ic.icon}</span><span class="icon-label">${ic.label}</span>`;
    el.ondblclick = () => openApp(ic.id);
    desktop.appendChild(el);
});

// ===================== START MENU =====================
function toggleStart() {
    document.getElementById('start-menu').classList.toggle('open');
}
function closeStart() {
    document.getElementById('start-menu').classList.remove('open');
}
document.addEventListener('click', e => {
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn'))
        closeStart();
});
</script>
