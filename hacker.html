    <h1>HACKER TERMINAL v1.337</h1>
    <p>Enter command:</p>
    <input type="text" id="command" placeholder="Type 'help' for commands">
    <button onclick="execute()">Execute</button>
    
    <div id="output"></div>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
        
        async function execute() {
            const cmd = document.getElementById('command').value.toLowerCase().trim();
            const output = document.getElementById('output');
            
            if (!cmd) return;
            
            let response = '';
            
            if (cmd === 'help') {
                response = `
Available commands:
- hack [target]
- scan
- decrypt
- bypass
- access mainframe
- download database
- inject [message]
- clear
                `;
            } else if (cmd.startsWith('hack ')) {
                const target = cmd.substring(5);
                response = `
Initializing hack on ${target}...
[##########] 100%
Access granted. ${target} has been hacked.
                `;
            } else if (cmd === 'scan') {
                response = `
Scanning network...
Found 47 devices
12 vulnerabilities detected
Systems ready for exploitation
                `;
            } else if (cmd === 'decrypt') {
                response = `
Decrypting files...
[##########] 100%
Password: hunter2
Encryption bypassed successfully
                `;
            } else if (cmd === 'bypass') {
                response = `
Bypassing security...
Firewall disabled
Intrusion detection offline
Access level: ADMINISTRATOR
                `;
            } else if (cmd === 'access mainframe') {
                response = `
Connecting to mainframe...
Connection established
Root access granted
Welcome, user_1337
                `;
            } else if (cmd === 'download database') {
                response = `
Downloading database...
[##########] 100%
Downloaded: top_secret_files.zip (999 GB)
Transfer complete
                `;
            } else if (cmd.startsWith('inject ')) {
                const message = cmd.substring(7);
                
                // Get character limit
                const limitResponse = await fetch('admin_process.php?get_char_limit=1');
                const charLimit = parseInt(await limitResponse.text());
                
                // Check message length
                if (message.length > charLimit) {
                    response = `
Error: Message too long
Maximum length: ${charLimit} characters
Your message: ${message.length} characters
                    `;
                    const newLine = document.createElement('pre');
                    newLine.textContent = '> ' + cmd + response;
                    output.appendChild(newLine);
                    document.getElementById('command').value = '';
                    return;
                }
                
                // Check for profanity
                const formData = new FormData();
                formData.append('text', message);
                
                try {
                    const profanityCheck = await fetch('check_profanity.php', {
                        method: 'POST',
                        body: formData
                    });
                    const profanityResult = await profanityCheck.text();
                    
                    if (profanityResult === 'profane') {
                        response = `
Error: Message contains inappropriate content
Injection blocked
                        `;
                        const newLine = document.createElement('pre');
                        newLine.textContent = '> ' + cmd + response;
                        output.appendChild(newLine);
                        document.getElementById('command').value = '';
                        return;
                    }
                } catch(e) {
                    console.error('Profanity check failed');
                }
                
                // Send to PHP backend
                const saveData = new FormData();
                saveData.append('message', message);
                
                try {
                    const result = await fetch('savemessage.php', {
                        method: 'POST',
                        body: saveData
                    });
                    const text = await result.text();
                    
                    if (text.includes('success')) {
                        response = `
Message injected successfully
Target: index.html
Payload: "${message}"
Changes will appear on next page load

You're welcome john
                        `;
                    } else {
                        response = `
Error: Injection failed
                        `;
                    }
                } catch(e) {
                    response = `
Error: Connection to server failed
                    `;
                }
            } else if (cmd === 'clear') {
                output.innerHTML = '';
                document.getElementById('command').value = '';
                return;
            } else {
                response = `
Error: Command '${cmd}' not recognized
Type 'help' for available commands
                `;
            }
            
            const newLine = document.createElement('pre');
            newLine.textContent = '> ' + cmd + response;
            output.appendChild(newLine);
            
            document.getElementById('command').value = '';
        }
        
        // Allow Enter key to execute
        document.getElementById('command').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                execute();
            }
        });
    </script>
