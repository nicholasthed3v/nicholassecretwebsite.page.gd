<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nicholas's Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #ddd;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .error {
            background: #1a0a0a;
            border: 1px solid #441111;
            color: #ff6666;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 15px;
            font-weight: normal;
        }
        
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: #000;
            border: 1px solid #222;
            color: #ddd;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #444;
        }
        
        button {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #aaa;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        
        button:hover {
            background: #1a1a1a;
            color: #fff;
        }
        
        .toggle-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        
        .toggle-link a {
            color: #888;
            text-decoration: none;
        }
        
        .toggle-link a:hover {
            color: #aaa;
        }
        
        .divider {
            border-top: 1px solid #222;
            margin: 25px 0;
        }
        
        .policy-links {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
        
        .policy-links a {
            color: #666;
            text-decoration: none;
            margin: 0 8px;
        }
        
        .policy-links a:hover {
            color: #888;
        }
        
        .disclosure {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
        }
        
        @media (max-width: 500px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Nicholas's Website</h1>
        <p class="subtitle">Login Required</p>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="loginSection">
            <div class="form-section">
                <h2>Login</h2>
                <form method="POST" action="login_process.php">
                    <label>Username</label>
                    <input type="text" name="login_username" required>
                    
                    <label>Password</label>
                    <input type="password" name="login_password" required>
                    
                    <button type="submit" name="login">Login</button>
                </form>
                
                <div class="toggle-link">
                    <a href="#" onclick="showRegister(); return false;">Don't have an account? Register</a>
                </div>
            </div>
        </div>
        
        <div id="registerSection" style="display: none;">
            <div class="form-section">
                <h2>Register</h2>
                <form method="POST" action="login_process.php">
                    <label>Username</label>
                    <input type="text" name="reg_username" required>
                    
                    <label>Password</label>
                    <input type="password" name="reg_password" required>
                    
                    <label>Confirm Password</label>
                    <input type="password" name="reg_confirm" required>
                    
                    <button type="submit" name="register">Register</button>
                </form>
                
                <div class="toggle-link">
                    <a href="#" onclick="showLogin(); return false;">Already have an account? Login</a>
                </div>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <form method="POST" action="login_process.php">
            <button type="submit" name="guest">Continue as Guest</button>
        </form>
        
        <div class="policy-links">
            <a href="terms.html">Terms of Service</a> | <a href="ppolicy.html">Privacy Policy</a>
        </div>
        
        <div class="disclosure">
            By using this site, you agree to our Terms of Service and Privacy Policy.
        </div>
    </div>

    <script>
        // Show error if present
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = error;
        }
        
        function showRegister() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').style.display = 'block';
        }
        
        function showLogin() {
            document.getElementById('registerSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
    </script>
</body>
</html>
